# Builds the signed Android APK and publishes it as its own GitHub Release,
# separate from the server and Linux client releases.
#
#   git tag android-v0.1.0 && git push origin android-v0.1.0
#     -> tests, builds + signs the APK, creates release "Ratatoskr Android v0.1.0"
#
# Signing needs four repository secrets (Settings -> Secrets and variables
# -> Actions). See clients/README.md for how to create the keystore:
#   RATATOSKR_KEYSTORE_BASE64   base64 of the .jks file
#   RATATOSKR_KEYSTORE_PASSWORD
#   RATATOSKR_KEY_ALIAS
#   RATATOSKR_KEY_PASSWORD
#
# Running it manually (Actions tab -> Run workflow) builds the APK as a
# workflow artifact without releasing anything.
name: Android client release

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    # Job-wide, not per step: once RATATOSKR_KEYSTORE_FILE is set, Gradle
    # needs the rest of these to configure the build at all.
    env:
      RATATOSKR_KEYSTORE_PASSWORD: ${{ secrets.RATATOSKR_KEYSTORE_PASSWORD }}
      RATATOSKR_KEY_ALIAS: ${{ secrets.RATATOSKR_KEY_ALIAS }}
      RATATOSKR_KEY_PASSWORD: ${{ secrets.RATATOSKR_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^ratatoskrAndroidVersion=//p' gradle.properties)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "android-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ratatoskrAndroidVersion=$version in clients/gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RATATOSKR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::RATATOSKR_KEYSTORE_BASE64 secret isn't set. Refusing to release an unsigned APK"
              exit 1
            fi
            echo "::warning::No signing secrets; building an unsigned APK"
            exit 0
          fi
          jks="$RUNNER_TEMP/release.jks"
          if ! echo "$KEYSTORE_BASE64" | base64 -d > "$jks" 2>/dev/null; then
            echo "::error::RATATOSKR_KEYSTORE_BASE64 isn't valid base64"
            exit 1
          fi
          # The checksum reveals nothing secret; compare it with
          # `sha256sum ~/ratatoskr-release.jks` to confirm the right file.
          echo "::notice::Decoded keystore: $(stat -c %s "$jks") bytes, sha256 $(sha256sum "$jks" | cut -c1-16)"
          # Fail here, with the specific cause, rather than deep inside Gradle.
          if ! keytool -list -keystore "$jks" -storepass "$RATATOSKR_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore won't open: RATATOSKR_KEYSTORE_PASSWORD is wrong (check for a stray space or newline), or RATATOSKR_KEYSTORE_BASE64 isn't the keystore (compare the checksum above)"
            exit 1
          fi
          if ! keytool -list -keystore "$jks" -storepass "$RATATOSKR_KEYSTORE_PASSWORD" -alias "$RATATOSKR_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore opens, but has no key named by RATATOSKR_KEY_ALIAS (should be: ratatoskr)"
            exit 1
          fi
          echo "RATATOSKR_KEYSTORE_FILE=$jks" >> "$GITHUB_ENV"

      - name: Install Android SDK platform
        # The runner's preinstalled SDK may not have the compileSdk platform yet.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # Both Gradle steps copy Gradle's "What went wrong" section into an
      # error annotation, so a failure's cause shows on the run summary.
      - name: Test
        run: |
          set -o pipefail
          ./gradlew --no-daemon :shared:jvmTest :android:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            echo "::error title=Tests failed::$(sed -n '/What went wrong/,/\* Try/p' "$RUNNER_TEMP/test.log" | head -25 | tr '\n' ' ')"
            exit 1
          }

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :android:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            echo "::error title=APK build failed::$(sed -n '/What went wrong/,/\* Try/p' "$RUNNER_TEMP/build.log" | head -25 | tr '\n' ' ')"
            exit 1
          }

      - name: Collect APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          apk="$(ls android/build/outputs/apk/release/*.apk | head -1)"
          cp "$apk" "$RUNNER_TEMP/out/Ratatoskr-${VERSION}.apk"
          cd "$RUNNER_TEMP/out"
          sha256sum "Ratatoskr-${VERSION}.apk" > SHA256SUMS
          if [ -n "${RATATOSKR_KEYSTORE_FILE:-}" ]; then
            set -o pipefail
            # The build-tools version installed above.
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "Ratatoskr-${VERSION}.apk" | tee "$RUNNER_TEMP/certs.txt"
            grep -q 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ratatoskr-android-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Ratatoskr for Android (8.0 and newer). Connects to your own Ratatoskr server. The server itself isn't part of this release; see server/README.md.

          ## Install

          1. On your phone, download \`Ratatoskr-${VERSION}.apk\` below.
          2. Open it. Android will ask you to allow installs from your browser or file manager ("Install unknown apps"). Allow it for that app.
          3. Tap **Install**. Ratatoskr appears in your app drawer.

          Updating: install a newer APK the same way; your saved server carries over.

          Verify the download with \`sha256sum -c SHA256SUMS\`. Signing certificate SHA-256: \`${cert}\`. Every release is signed with this same key, and Android refuses an update signed by any other.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ratatoskr Android v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/out/"*
